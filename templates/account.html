{% extends "base.html" %}
{% block content %}
<h1>Change password</h1><p class="sub">Use at least 8 characters.</p>
<form class="card" method="post" style="max-width:420px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field"><label>Current password</label><input type="password" name="current_password" autocomplete="current-password" required></div>
  <div class="field"><label>New password</label><input type="password" name="new_password" minlength="8" autocomplete="new-password" required></div>
  <div class="field"><label>Confirm new password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
  <button class="btn">Save password</button>
</form>
{% endblock %}
